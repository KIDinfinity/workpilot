# 生产 compose：以 deploy/docker-compose.yml（dev）为底复制，只改 prod 差异。
# 关键差异：
#   - api 用 SiliconFlow Embedding（与 dev 同模型 bge-m3，1024 维）
#   - web 只暴露 80，Caddy 走 HTTP + basic_auth（IP 直连，域名/TLS 留作后续优化）
#   - qdrant / minio 不写 ports（只在 compose 内网可达，不暴露公网）
name: workpilot

services:
  api:
    build: { context: .., dockerfile: apps/api/Dockerfile }
    env_file: ../.env # 服务器上的 .env（含 EMBEDDING_API_KEY 等密钥）；下面 environment 覆盖容器内地址
    environment:
      APP_ENV: prod
      DATABASE_URL: sqlite:////app/data/workpilot.db
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: http://minio:9000
      EMBEDDING_BASE_URL: https://api.siliconflow.cn/v1 # 与 dev 同模型 bge-m3，1024 维
      EMBEDDING_MODEL: BAAI/bge-m3 # EMBEDDING_API_KEY 放服务器 .env
    volumes: [api-data:/app/data]
    depends_on:
      qdrant: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  web:
    build: { context: .., dockerfile: apps/web/Dockerfile }
    ports: ["80:80"]
    environment:
      BASIC_AUTH_USER: ${BASIC_AUTH_USER}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH}
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest # 与 infra 同 tag；快照恢复要求版本兼容
    volumes: [qdrant-data:/qdrant/storage]
    healthcheck: # 镜像内没有 curl/wget，用 bash 探测端口
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  minio:
    image: minio/minio:latest # 与 infra 同 tag
    command: server /data --console-address ":9001"
    environment:
      # 根账号 = api 用的 access/secret，保证两边一致；生产用与 dev 不同的强密码（见服务器 .env）
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

volumes:
  api-data:
  qdrant-data:
  minio-data:
