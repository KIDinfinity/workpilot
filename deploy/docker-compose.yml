name: workpilot

services:
  api:
    build: { context: .., dockerfile: apps/api/Dockerfile }
    env_file: ../.env # 密钥；下面 environment 覆盖容器内地址
    environment:
      APP_ENV: dev
      DATABASE_URL: sqlite:////app/data/workpilot.db
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: http://minio:9000
      EMBEDDING_BASE_URL: http://host.docker.internal:11434/v1 # Mac 上的 Ollama
    extra_hosts:
      - "host.docker.internal:host-gateway" # Linux 也能解析；Mac Docker Desktop 默认已支持
    volumes: [api-data:/app/data]
    depends_on:
      qdrant: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  web:
    build: { context: .., dockerfile: apps/web/Dockerfile }
    ports: ["8080:80"]
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest # 与 infra 同 tag；快照恢复要求版本兼容
    volumes: [qdrant-data:/qdrant/storage]
    healthcheck: # 镜像内没有 curl/wget，用 bash 探测端口
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  minio:
    image: minio/minio:latest # 与 infra 同 tag
    command: server /data --console-address ":9001"
    environment:
      # 根账号 = api 用的 access/secret，保证两边一致，不额外引入变量
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

volumes:
  api-data:
  qdrant-data:
  minio-data:
